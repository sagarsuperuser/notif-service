name: Publish images to GHCR

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write
  # the tag bump is delivered as a PR, not a push to main
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/notif-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        svc:
          - name: notif-api
            cmd: api
          - name: notif-worker
            cmd: worker
          - name: notif-webhook
            cmd: webhook
          - name: notif-mock-provider
            cmd: mock-provider

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.svc.name }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            CMD=${{ matrix.svc.cmd }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-kustomize-tags:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update prod image tags
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          tag="sha-${short_sha}"
          export TAG="$tag"
          echo "Before update:"
          grep -n "newTag" deploy/k8s/overlays/prod/kustomization.yaml || true
          python - <<'PY'
          import pathlib
          import re
          import os

          tag = os.environ["TAG"]
          path = pathlib.Path("deploy/k8s/overlays/prod/kustomization.yaml")
          data = path.read_text()
          data = re.sub(r"^\s*newTag:\s*.+$", f"    newTag: {tag}", data, flags=re.MULTILINE)
          path.write_text(data)
          PY
          echo "Updated newTag to ${tag}"
          echo "After update:"
          grep -n "newTag" deploy/k8s/overlays/prod/kustomization.yaml || true
          echo "git status:"
          git status --porcelain
          git --no-pager diff -- deploy/k8s/overlays/prod/kustomization.yaml || true

      # main requires a passing CI run, and this bot's commits carried
      # [skip ci] — so a direct push could never satisfy the check and was
      # rejected outright. Opening a PR is the right shape anyway: the tag bump
      # gets the same build/vet/test gate as any other change to main, and a
      # bot committing straight to a protected branch stops being a hole in it.
      - name: Open a PR with the new tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! git status --porcelain | grep -q .; then
            echo "image tags already current; nothing to do"
            exit 0
          fi

          short_sha="${GITHUB_SHA:0:7}"
          branch="chore/image-tags-${short_sha}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add deploy/k8s/overlays/prod/kustomization.yaml
          git commit -m "chore: point prod at image tag sha-${short_sha}"
          git push -u origin "$branch"

          gh pr create \
            --title "chore: point prod at image tag sha-${short_sha}" \
            --body "Built from ${GITHUB_SHA}. Opened automatically after the images for this commit were pushed to GHCR." \
            --head "$branch"
