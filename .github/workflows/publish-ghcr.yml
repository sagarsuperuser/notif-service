name: Publish images to GHCR

on:
  push:
    branches: ["main"]
    # A merged tag bump changes only this file. Building on it would publish
    # images identical to the ones just deployed and open another bump PR —
    # every bump merge would beget the next, forever.
    paths-ignore:
      - deploy/k8s/overlays/prod/kustomization.yaml
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write
  # the tag bump is delivered as a PR, not a push to main
  pull-requests: write
  # to approve the CI run GitHub holds on the bump PR (see the last step)
  actions: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/notif-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        svc:
          - name: notif-api
            cmd: api
          - name: notif-worker
            cmd: worker
          - name: notif-webhook
            cmd: webhook
          - name: notif-mock-provider
            cmd: mock-provider

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.svc.name }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            CMD=${{ matrix.svc.cmd }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-kustomize-tags:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update prod image tags
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          tag="sha-${short_sha}"
          export TAG="$tag"
          echo "Before update:"
          grep -n "newTag" deploy/k8s/overlays/prod/kustomization.yaml || true
          python - <<'PY'
          import pathlib
          import re
          import os

          tag = os.environ["TAG"]
          path = pathlib.Path("deploy/k8s/overlays/prod/kustomization.yaml")
          data = path.read_text()
          data = re.sub(r"^\s*newTag:\s*.+$", f"    newTag: {tag}", data, flags=re.MULTILINE)
          path.write_text(data)
          PY
          echo "Updated newTag to ${tag}"
          echo "After update:"
          grep -n "newTag" deploy/k8s/overlays/prod/kustomization.yaml || true
          echo "git status:"
          git status --porcelain
          git --no-pager diff -- deploy/k8s/overlays/prod/kustomization.yaml || true

      # main requires a passing CI run, and this bot's commits carried
      # [skip ci] — so a direct push could never satisfy the check and was
      # rejected outright. Opening a PR is the right shape anyway: the tag bump
      # gets the same build/vet/test gate as any other change to main, and a
      # bot committing straight to a protected branch stops being a hole in it.
      - name: Open a PR with the new tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! git status --porcelain | grep -q .; then
            echo "image tags already current; nothing to do"
            exit 0
          fi

          short_sha="${GITHUB_SHA:0:7}"
          branch="chore/image-tags-${short_sha}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add deploy/k8s/overlays/prod/kustomization.yaml
          git commit -m "chore: point prod at image tag sha-${short_sha}"
          git push -u origin "$branch"

          pr_url=$(gh pr create \
            --title "chore: point prod at image tag sha-${short_sha}" \
            --body "Built from ${GITHUB_SHA}. Opened automatically after the images for this commit were pushed to GHCR." \
            --head "$branch")
          echo "opened $pr_url"

          # GitHub DOES create the PR's CI run, but because the PR was opened by
          # github-actions[bot] it holds that run as "action_required" until a
          # maintainer approves it. Nobody did, the held runs expired, the
          # required check never passed, and 17 bump PRs piled up unmergeable.
          # (A workflow_dispatch run on the branch does not help: branch
          # protection only counts the PR's own run.)
          #
          # Approving it here is safe: the PR is main's code plus a generated
          # tag change, produced by this workflow from a commit already merged
          # to main. MERGING it — pointing prod at the new images — stays a
          # human decision.
          run_id=""
          for _ in $(seq 1 24); do
            run_id=$(gh run list --branch "$branch" --event pull_request --limit 5 \
              --json databaseId,conclusion \
              --jq '[.[] | select(.conclusion == "action_required")][0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -n "$run_id" ] && gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve"; then
            echo "approved held CI run ${run_id} for ${branch}"
          else
            echo "::warning::could not approve the CI run for ${branch}; approve it from the PR's Checks tab (Approve and run)"
          fi

          # Each bump supersedes every earlier one (they all rewrite the same
          # four lines), so close the older ones instead of leaving a queue.
          new_number="${pr_url##*/}"
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("chore/image-tags-")) | "\(.number) \(.headRefName)"' |
          while read -r number head; do
            if [ "$head" != "$branch" ]; then
              gh pr close "$number" --delete-branch \
                --comment "Superseded by #${new_number}, which points prod at a newer image."
            fi
          done
