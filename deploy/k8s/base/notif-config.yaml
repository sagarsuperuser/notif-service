apiVersion: v1
kind: ConfigMap
metadata:
  name: notif-config
data:
  # Common
  AWS_REGION: "ap-south-1"
  SQS_QUEUE_URL: "https://sqs.ap-south-1.amazonaws.com/139831607173/notif-prod-test-send"
  MAX_SMS_PER_DAY: "1000000"
  PUBLIC_WEBHOOK_URL: "http://notif-webhook-svc/v1/webhooks/twilio/status"

  # Worker / SQS tuning
  WORKER_CONCURRENCY: "20"
  SQS_WAIT_TIME: "20"
  SQS_MAX_MSGS: "10"
  SQS_VISIBILITY_TIMEOUT: "60"
  # Concurrent ReceiveMessage calls. 0 = one per ten handler slots.
  SQS_RECEIVERS: "0"
  SQS_SEND_BATCH_SIZE: "10"
  SQS_SEND_BATCH_DELAY: "5ms"
  SQS_DELETE_BATCH_WAIT: "20ms"

  # Webhook processor / SQS tuning (separate knobs so we can scale/experiment independently)

  # Twilio endpoint config
  TWILIO_BASE_URL: "http://notif-mock-provider-svc"

  # Twilio throttling knobs (per pod)
  TWILIO_RPS_PER_POD: "70"
  TWILIO_BURST: "70"

  # Webhook behavior knobs
