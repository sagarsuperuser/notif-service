apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notif-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notif-api
  minReplicas: 7
  maxReplicas: 9
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notif-webhook
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notif-webhook
  minReplicas: 7
  maxReplicas: 9
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notif-mock-provider
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notif-mock-provider
  minReplicas: 5
  # Dedicated mock-provider capacity: on-demand + spot nodes.
  maxReplicas: 7
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
