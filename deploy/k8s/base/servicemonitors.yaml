apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: notif-api
  namespace: monitoring
  labels:
    release: kps
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: notif-api
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
