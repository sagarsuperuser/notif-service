controller:
  kind: Deployment
  replicaCount: 2

  nodeSelector:
    workload: ingress

  tolerations:
    - key: "workload"
      operator: "Equal"
      value: "ingress"
      effect: "NoSchedule"

  service:
    type: NodePort
    nodePorts:
      http: 30080
      https: 30443
    externalTrafficPolicy: Local

  ingressClassResource:
    name: nginx
    enabled: true
    default: true

  ingressClass: nginx

  admissionWebhooks:
    enabled: true

  metrics:
    enabled: true
